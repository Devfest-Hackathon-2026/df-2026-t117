name: ar_guide
description: "Safe Japan AR guidance (S11 only, Android): turn arrow on the camera view, opened from the web mock by a deep link."
publish_to: 'none'
version: 1.0.2+9

environment:
  sdk: ^3.13.3

dependencies:
  camera: 0.12.2
  cloud_firestore: ^7.1.0
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  firebase_remote_config: ^7.0.1
  flutter:
    sdk: flutter
  flutter_local_notifications: 22.3.3 # 23 needs compileSdk 37, which AGP 9.1 does not support
  flutter_tts: ^4.2.5
  just_audio: ^0.10.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # Copy of mocks/evacuate/public/voice/ (Chirp 3 HD clips). See README.
  assets:
    - assets/voice/
    - assets/voice/en/
    - assets/voice/ja/
    - assets/voice/zh-Hans/
    - assets/voice/ko/
    - assets/voice/ar/
    - assets/voice/help/ # feature F (lib/app/help/), made by tools/voice/help-ja.mjs
    # OFL texts of the bundled fonts, shipped in the APK and added to the license registry.
    - assets/fonts/OFL-NotoSans.txt
    - assets/fonts/OFL-NotoSansCJK.txt
    - assets/fonts/OFL-NotoSansArabic.txt
  # Bundled Noto (architecture D15). Variable fonts (wght 100-900) from google/fonts, OFL-1.1; the
  # license texts sit next to them. Families and order: lib/src/fonts.dart. See docs/third-party.md.
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-VF.ttf
    - family: NotoSansJP
      fonts:
        - asset: assets/fonts/NotoSansJP-VF.ttf
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-VF.ttf
    - family: NotoSansKR
      fonts:
        - asset: assets/fonts/NotoSansKR-VF.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-VF.ttf
